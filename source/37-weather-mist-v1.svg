<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="-1.5 -1.5 75 75">
  <!-- Fenestra Weather - weather-mist - (c) 2026 naykkalak - LGPL-3.0-or-later -->
  <defs>
    <path id="leftLobe" d="M 9 34 a 7.5 7.5 0 0 1 0.3 -15 a 8 8 0 0 1 12.7 4 a 12 12 0 0 0 -3.5 11 z"/>

    <radialGradient id="baseMain" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#E4F0FF"/>
      <stop offset="1" stop-color="#8FB4EA"/>
    </radialGradient>
    <radialGradient id="baseRight" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#84AEE8"/>
    </radialGradient>
    <radialGradient id="baseLeft" cx="0.4" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#84AEE8"/>
    </radialGradient>

    <radialGradient id="wash" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftCrease" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5582D3" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#5582D3" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5582D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightCrease" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5582D3" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#5582D3" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5582D3" stop-opacity="0"/>
    </radialGradient>

    <filter id="softenSeams" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.18"/>
    </filter>

  </defs>

  <!-- Nuage (identique à weather-fog) -->
  <g transform="translate(0,-8)">
    <g transform="translate(-2.91,-5.51) scale(1.7625)">
      <g fill="#5582D3" opacity="0.15">
        <circle cx="23" cy="23" r="12.9"/>
        <circle cx="33" cy="27" r="9.9"/>
        <use href="#leftLobe" transform="translate(-0.6,-1.04) scale(1.04)"/>
      </g>
    </g>

    <g transform="translate(-2.91,-5.51) scale(1.7625)" filter="url(#softenSeams)">
      <circle cx="23" cy="23" r="12.5" fill="url(#baseMain)"/>
      <circle cx="33" cy="27" r="9.5" fill="url(#baseRight)"/>
      <use href="#leftLobe" fill="url(#baseLeft)"/>

      <circle cx="23" cy="23" r="12.5" fill="url(#wash)"/>
      <circle cx="33" cy="27" r="9.5" fill="url(#wash)"/>
      <use href="#leftLobe" fill="url(#wash)"/>

      <ellipse cx="19.5" cy="25" rx="6.5" ry="9.5" fill="url(#leftCrease)"/>
      <ellipse cx="29" cy="24.5" rx="7" ry="10" fill="url(#rightCrease)"/>
    </g>
  </g>

  <!-- Brume : barres du brouillard entrecoupées (voile moins épais), espaces décalés d'une barre à l'autre -->
  <g fill="#89AFD1">
    <g opacity="0.75">
      <rect x="10" y="52" width="12" height="3" rx="1.5"/>
      <rect x="26" y="52" width="14" height="3" rx="1.5"/>
      <rect x="44" y="52" width="6" height="3" rx="1.5"/>
    </g>
    <g opacity="0.6">
      <rect x="18" y="57" width="8" height="3" rx="1.5"/>
      <rect x="30" y="57" width="16" height="3" rx="1.5"/>
      <rect x="50" y="57" width="12" height="3" rx="1.5"/>
    </g>
    <g opacity="0.75">
      <rect x="6" y="62" width="14" height="3" rx="1.5"/>
      <rect x="24" y="62" width="10" height="3" rx="1.5"/>
      <rect x="38" y="62" width="8" height="3" rx="1.5"/>
    </g>
  </g>
</svg>
