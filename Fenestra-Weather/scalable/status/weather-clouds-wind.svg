<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="-1.5 -1.5 75 75">
  <!-- Fenestra Weather - weather-clouds-wind - (c) 2026 naykkalak - LGPL-3.0-or-later -->
  <defs>
    <linearGradient id="sunGrad" x1="3" y1="69" x2="69" y2="-3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8600A"/>
      <stop offset="0.55" stop-color="#F5A623"/>
      <stop offset="1" stop-color="#FFD84D"/>
    </linearGradient>

    <path id="leftLobe" d="M 9 34 a 7.5 7.5 0 0 1 0.3 -15 a 8 8 0 0 1 12.7 4 a 12 12 0 0 0 -3.5 11 z"/>
    <radialGradient id="baseMain" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#E4F0FF"/>
      <stop offset="1" stop-color="#8FB4EA"/>
    </radialGradient>
    <radialGradient id="baseRight" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#84AEE8"/>
    </radialGradient>
    <radialGradient id="baseLeft" cx="0.4" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#84AEE8"/>
    </radialGradient>
    <radialGradient id="wash" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftCrease" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5582D3" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#5582D3" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5582D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightCrease" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5582D3" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#5582D3" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5582D3" stop-opacity="0"/>
    </radialGradient>
    <filter id="softenSeams" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.18"/>
    </filter>

    <linearGradient id="wind1" x1="8" y1="0" x2="58" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D2DDEB"/>
      <stop offset="1" stop-color="#AFC1D8"/>
    </linearGradient>
    <linearGradient id="wind2" x1="16" y1="0" x2="67" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C3D1E3"/>
      <stop offset="1" stop-color="#9DB1CB"/>
    </linearGradient>
    <linearGradient id="wind3" x1="6" y1="0" x2="38" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FA5C2"/>
      <stop offset="1" stop-color="#6E86A8"/>
    </linearGradient>
  </defs>

  <!-- Soleil + nuage d'origine, placés comme sur weather-overcast-wind -->
  <g transform="matrix(0.675749, 0, 0, 0.661174, -0.375646, 3.873098)">
    <!-- Soleil, décalé légèrement à gauche (horizontal uniquement) -->
    <circle cx="30" cy="36" r="30" fill="url(#sunGrad)"/>

    <!-- Nuage, position inchangée -->
    <g transform="translate(-2.91,4.49) scale(1.7625)">
      <g fill="#5582D3" opacity="0.15">
        <circle cx="23" cy="23" r="12.9"/>
        <circle cx="33" cy="27" r="9.9"/>
        <use href="#leftLobe" transform="translate(-0.6,-1.04) scale(1.04)"/>
      </g>
    </g>
    <g transform="translate(-2.91,4.49) scale(1.7625)" filter="url(#softenSeams)">
      <circle cx="23" cy="23" r="12.5" fill="url(#baseMain)"/>
      <circle cx="33" cy="27" r="9.5" fill="url(#baseRight)"/>
      <use href="#leftLobe" fill="url(#baseLeft)"/>
      <circle cx="23" cy="23" r="12.5" fill="url(#wash)"/>
      <circle cx="33" cy="27" r="9.5" fill="url(#wash)"/>
      <use href="#leftLobe" fill="url(#wash)"/>
      <ellipse cx="19.5" cy="25" rx="6.5" ry="9.5" fill="url(#leftCrease)"/>
      <ellipse cx="29" cy="24.5" rx="7" ry="10" fill="url(#rightCrease)"/>
    </g>
  </g>

  <!-- Vent sortant du nuage vers la droite (même tracé et mêmes nuances que weather-overcast-wind) -->
  <g transform="matrix(0.9, 0, 0, 0.9, 10, 3)" fill="none" stroke-width="6.1" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="url(#wind1)" d="M8 44 H48 C54 44 58 40 58 35.5 C58 31.5 55 29 51.5 29 C48.5 29 46 31 46 34"/>
    <path stroke="url(#wind2)" d="M16 54 H58 C63.5 54 67 57.5 67 61.5 C67 65.5 63.5 68 60 68 C57 68 54.5 66 54.5 63"/>
    <path stroke="url(#wind3)" d="M6 63 H38"/>
  </g>
</svg>
