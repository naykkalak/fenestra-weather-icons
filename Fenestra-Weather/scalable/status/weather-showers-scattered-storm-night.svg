<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="-1.5 -1.5 75 75" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Fenestra Weather - weather-showers-scattered-storm-night - (c) 2026 naykkalak - LGPL-3.0-or-later --><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="moonGrad" x1="3" y1="69" x2="69" y2="-3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EE7F18"/>
      <stop offset="0.56" stop-color="#EEB82E"/>
      <stop offset="1" stop-color="#FEB649"/>
    </linearGradient>

    <path id="leftLobe" d="M 9 34 a 7.5 7.5 0 0 1 0.3 -15 a 8 8 0 0 1 12.7 4 a 12 12 0 0 0 -3.5 11 z"/>

    <radialGradient id="baseMain" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#C7D6E5"/>
      <stop offset="1" stop-color="#5C7691"/>
    </radialGradient>
    <radialGradient id="baseRight" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#BFD0E0"/>
      <stop offset="1" stop-color="#55708C"/>
    </radialGradient>
    <radialGradient id="baseLeft" cx="0.4" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#BFD0E0"/>
      <stop offset="1" stop-color="#55708C"/>
    </radialGradient>

    <radialGradient id="wash" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftCrease" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3F5E7A" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#3F5E7A" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3F5E7A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightCrease" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3F5E7A" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#3F5E7A" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3F5E7A" stop-opacity="0"/>
    </radialGradient>

    <filter id="softenSeams" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.18"/>
    </filter>

    <linearGradient id="boltGradient" x1="46.647099" y1="67.621902" x2="33.6506" y2="51.489899"
      gradientUnits="userSpaceOnUse" gradientTransform="matrix(1.1539446,0,0,1.1982129,-13.555023,-12.486139)">
      <stop stop-color="#E25A01"/>
      <stop offset="1" stop-color="#FAB01C"/>
    </linearGradient>
  </defs>

  <!-- Décalage global vers le bas pour équilibrer avec la lune -->
  <g transform="translate(0,-6)">

    <!-- Lune, décalée légèrement à gauche -->
    <g transform="translate(-6,0)">
      <circle cx="36" cy="36" r="30" fill="url(#moonGrad)"/>
      <g fill="#D9861A" opacity="0.55">
        <ellipse cx="22.5" cy="19.5" rx="5.4" ry="3.9" transform="rotate(-15 22.5 19.5)"/>
        <ellipse cx="45" cy="16.5" rx="3.9" ry="3" transform="rotate(20 45 16.5)"/>
        <ellipse cx="52.5" cy="36" rx="6.9" ry="5.1" transform="rotate(-10 52.5 36)"/>
        <ellipse cx="24" cy="42" rx="4.5" ry="3.3" transform="rotate(30 24 42)"/>
        <ellipse cx="15" cy="33" rx="3" ry="2.4"/>
      </g>
    </g>

    <!-- Contour très léger du nuage -->
    <g transform="translate(-2.91,4.49) scale(1.7625)">
      <g fill="#3F5E7A" opacity="0.15">
        <circle cx="23" cy="23" r="12.9"/>
        <circle cx="33" cy="27" r="9.9"/>
        <use href="#leftLobe" transform="translate(-0.6,-1.04) scale(1.04)"/>
      </g>
    </g>

    <!-- Nuage orage, niveau 2 (équilibre avec la lune) -->
    <g transform="translate(-2.91,4.49) scale(1.7625)" filter="url(#softenSeams)">
      <circle cx="23" cy="23" r="12.5" fill="url(#baseMain)"/>
      <circle cx="33" cy="27" r="9.5" fill="url(#baseRight)"/>
      <use href="#leftLobe" fill="url(#baseLeft)"/>
      <circle cx="23" cy="23" r="12.5" fill="url(#wash)"/>
      <circle cx="33" cy="27" r="9.5" fill="url(#wash)"/>
      <use href="#leftLobe" fill="url(#wash)"/>
      <ellipse cx="19.5" cy="25" rx="6.5" ry="9.5" fill="url(#leftCrease)"/>
      <ellipse cx="29" cy="24.5" rx="7" ry="10" fill="url(#rightCrease)"/>
    </g>

    <g transform="matrix(0.838,0,0,0.838,8.1666666,16.0766666)">
      <path fill-rule="evenodd" clip-rule="evenodd"
        d="M 24.443333,53.606326 38.436296,31.811792 c 0.568663,-0.88584 1.899855,-0.38235 1.786651,0.675792 l -1.794383,16.76815 h 6.112214 c 0.804415,0 1.28434,0.931011 0.838109,1.626095 L 31.385924,72.676362 c -0.568663,0.885839 -1.899854,0.38235 -1.786651,-0.675792 L 31.39354,55.232419 h -6.112097 c -0.804531,0 -1.284457,-0.931131 -0.83811,-1.626093 z"
        fill="url(#boltGradient)"/>
    </g>

  </g>
</svg>
